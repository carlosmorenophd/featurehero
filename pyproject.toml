[project]
name = "featurehero"
version = "2026.1.1"
description = "Application desktop for Genetic Orchestrator for selection of variables and machine model"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [
    { name = "Juan Carlos Moreno Sanchez" },
]
keywords = [
    "feature-selection",
    "genetic-algorithm",
    "machine-learning",
    "regression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.3.3,<3.0.0",
    "numpy>=2.3.4,<3.0.0",
    "numbers-parser>=4.16.2,<5.0.0",
    "scikit-learn>=1.7.2,<2.0.0",
    "xgboost>=3.1.1,<4.0.0",
    "matplotlib>=3.10.7,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "psutil>=7.1.3,<8.0.0",
]

[project.scripts]
featurehero = "featurehero.main:main"

[tool.poetry]
packages = [{ include = "featurehero" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
