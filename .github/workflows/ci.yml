name: Feature validation

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate feature branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Compile Python files
        run: python -m compileall -q featurehero

      - name: Check package configuration
        run: poetry check

      - name: Run tests
        run: poetry run pytest -q

      - name: Build distributions
        run: poetry build
