name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pipx install poetry

      - name: Configure Poetry cache
        run: |
          echo "POETRY_CACHE_DIR=$HOME/.cache/pypoetry" >> "$GITHUB_ENV"

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install

      - name: Compile Python files
        run: python -m compileall -q featurehero

      - name: Validate and build release
        run: python .github/scripts/validate_release.py --run-preflight --check-pypi

      - name: Read package version
        id: package-version
        run: echo "version=$(poetry version -s)" >> "$GITHUB_OUTPUT"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: featurehero-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Export package version
        run: echo "${{ steps.package-version.outputs.version }}" > package-version.txt

      - name: Upload package version
        uses: actions/upload-artifact@v4
        with:
          name: featurehero-version
          path: package-version.txt

  publish-pypi:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    needs: build-release
    environment: pypi
    permissions:
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: featurehero-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/

      - name: Download package version
        uses: actions/download-artifact@v4
        with:
          name: featurehero-version
          path: .

  verify-pypi:
    name: Verify clean PyPI installation
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package version
        uses: actions/download-artifact@v4
        with:
          name: featurehero-version
          path: .

      - name: Install and verify published package
        run: python .github/scripts/verify_pypi_install.py --version "$(cat package-version.txt)"
